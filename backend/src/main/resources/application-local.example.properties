# Copy this file to application-local.properties for local development.
# application-local.properties is gitignored and should contain your real local values.
#
# Registry-first mode is the default. Local catalog mode is legacy and development-only.

spring.datasource.url=jdbc:postgresql://localhost:5432/risk_score_service
spring.datasource.username=postgres
spring.datasource.password=postgres

schema-catalog.mode=confluent
confluent.schema-registry.url=http://localhost:8081
confluent.schema-registry.username=
confluent.schema-registry.password=
confluent.schema-registry.api-key=
confluent.schema-registry.api-secret=
