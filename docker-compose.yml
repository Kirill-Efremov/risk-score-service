services:
  postgres:
    image: postgres:16
    container_name: risk-score-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schema_risk}
      POSTGRES_USER: ${POSTGRES_USER:-schema_risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schema_risk}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schema_risk} -d ${POSTGRES_DB:-schema_risk}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: risk-score-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: risk-score-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: risk-score-schema-registry
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
      - "8081:8081"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risk-score-backend
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/schema_risk}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-schema_risk}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-schema_risk}
      SCHEMA_CATALOG_MODE: ${SCHEMA_CATALOG_MODE:-confluent}
      CONFLUENT_SCHEMA_REGISTRY_URL: ${CONFLUENT_SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      CONFLUENT_SCHEMA_REGISTRY_USERNAME: ${CONFLUENT_SCHEMA_REGISTRY_USERNAME:-}
      CONFLUENT_SCHEMA_REGISTRY_PASSWORD: ${CONFLUENT_SCHEMA_REGISTRY_PASSWORD:-}
      CONFLUENT_SCHEMA_REGISTRY_API_KEY: ${CONFLUENT_SCHEMA_REGISTRY_API_KEY:-}
      CONFLUENT_SCHEMA_REGISTRY_API_SECRET: ${CONFLUENT_SCHEMA_REGISTRY_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret-change-me-dev-secret-32chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: risk-score-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
