spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/schema_risk}
    username: ${SPRING_DATASOURCE_USERNAME:schema_risk}
    password: ${SPRING_DATASOURCE_PASSWORD:schema_risk}
  flyway:
    enabled: true

schema-catalog:
  mode: ${SCHEMA_CATALOG_MODE:confluent}

confluent:
  schema-registry:
    url: ${CONFLUENT_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    username: ${CONFLUENT_SCHEMA_REGISTRY_USERNAME:}
    password: ${CONFLUENT_SCHEMA_REGISTRY_PASSWORD:}
    api-key: ${CONFLUENT_SCHEMA_REGISTRY_API_KEY:}
    api-secret: ${CONFLUENT_SCHEMA_REGISTRY_API_SECRET:}
